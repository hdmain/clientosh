name: Beta

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  build:
    name: Build all beta packages
    concurrency:
      group: beta-build-${{ github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/build-packages.yml
    with:
      package_label: beta
      build_channel: beta
      build_number: ${{ github.run_number }}

  publish:
    name: Publish rolling beta
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: beta-publish-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download all packages
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Verify packages and generate checksums
        run: |
          test -f dist/clientosh-beta-win64-setup.exe
          test -f dist/clientosh-beta-win64-portable.zip
          test -f dist/clientosh-beta-amd64.deb
          test -f dist/clientosh-beta-x86_64.rpm
          test -f dist/clientosh-beta-x86_64.AppImage
          test -f dist/clientosh-beta-linux-x86_64.tar.gz
          test -f dist/clientosh-beta-x86_64.pkg.tar.zst
          test -f dist/clientosh-beta-macos.dmg
          (cd dist && sha256sum clientosh-beta-* > CHECKSUMS-beta.txt)

      - name: Prepare shared release description
        run: |
          {
            echo "Automated beta build from commit [\`${GITHUB_SHA}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})."
            echo
            echo "This prerelease is replaced after every successful build from \`main\`."
            echo
            cat .github/release-assets.md
          } > RELEASE_BODY.md

      - name: Move rolling beta tag
        run: |
          git tag --force beta "$GITHUB_SHA"
          git push origin refs/tags/beta --force

      - name: Recreate rolling beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view beta --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete beta --repo "$GITHUB_REPOSITORY" --yes
          fi

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: beta
          target_commitish: ${{ github.sha }}
          name: Beta
          prerelease: true
          files: dist/*
          body_path: RELEASE_BODY.md
          overwrite_files: true
          generate_release_notes: false
          make_latest: false
