name: Release

on:
  push:
    tags:
      - "v*"
  # Manual rebuild: choose the v* tag from the "Use workflow from" dropdown
  # (trusted github.ref) — do not pass an arbitrary tag string input.
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  build:
    name: Build all release packages
    uses: ./.github/workflows/build-packages.yml
    with:
      package_label: ${{ github.ref_name }}
      build_channel: stable
      build_number: "0"

  publish:
    name: Publish stable release
    needs: build
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Download all packages
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Verify packages and generate checksums
        run: |
          test -f "dist/clientosh-${RELEASE_TAG}-win64-setup.exe"
          test -f "dist/clientosh-${RELEASE_TAG}-win64-portable.zip"
          test -f "dist/clientosh-${RELEASE_TAG}-amd64.deb"
          test -f "dist/clientosh-${RELEASE_TAG}-x86_64.rpm"
          test -f "dist/clientosh-${RELEASE_TAG}-x86_64.AppImage"
          test -f "dist/clientosh-${RELEASE_TAG}-linux-x86_64.tar.gz"
          test -f "dist/clientosh-${RELEASE_TAG}-x86_64.pkg.tar.zst"
          test -f "dist/clientosh-${RELEASE_TAG}-macos.dmg"
          (cd dist && sha256sum clientosh-* > CHECKSUMS.txt)

      - name: Prepare shared release description
        run: |
          {
            echo "Build from tag \`${RELEASE_TAG}\`."
            echo
            cat .github/release-assets.md
          } > RELEASE_BODY.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          prerelease: false
          files: dist/*
          body_path: RELEASE_BODY.md
          overwrite_files: true
          generate_release_notes: false
          make_latest: true
