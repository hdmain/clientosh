name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (Ubuntu, GCC)
            # Ubuntu 24.04 ships freerdp3-dev required by the embedded RDP client.
            os: ubuntu-24.04
            cmake_args: -G "Unix Makefiles"
            build_dir: build-linux
          - name: macOS (Clang)
            os: macos-latest
            cmake_args: -G "Unix Makefiles"
            build_dir: build-macos
          - name: Windows (MSYS2 MinGW)
            os: windows-latest
            shell: msys2 {0}
            build_dir: build-win
            msys2: MINGW64

    defaults:
      run:
        shell: ${{ matrix.shell || 'bash' }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Qt & deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libqt6svg6-dev libssh-dev libssl-dev \
            libgl1-mesa-dev libegl1-mesa-dev freerdp3-dev

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install qt libssh openssl@3 freerdp

      - name: Install deps (Windows / MSYS2)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msys2 }}
          update: true
          install: >-
            git
            ninja
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-svg
            mingw-w64-x86_64-libssh
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-freerdp

      - name: Configure
        run: |
          cmake -S . -B ${{ matrix.build_dir }} ${{ matrix.cmake_args }} \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build ${{ matrix.build_dir }} -j 4

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          test -x ${{ matrix.build_dir }}/clientosh
          test -f ${{ matrix.build_dir }}/addons-bundle/index.json
          test -n "$(find ${{ matrix.build_dir }}/addons-bundle/ai-agent -maxdepth 1 -type f | head -1)"
          echo "clientosh + addons-bundle built successfully"

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          test -x ${{ matrix.build_dir }}/clientosh
          test -f ${{ matrix.build_dir }}/addons-bundle/index.json
          test -n "$(find ${{ matrix.build_dir }}/addons-bundle/ai-agent -maxdepth 1 -type f | head -1)"
          echo "clientosh + addons-bundle built successfully"

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: |
          test -x ${{ matrix.build_dir }}/clientosh.exe
          test -f ${{ matrix.build_dir }}/addons-bundle/index.json
          test -n "$(find ${{ matrix.build_dir }}/addons-bundle/ai-agent -maxdepth 1 -type f | head -1)"
          echo "clientosh.exe + addons-bundle built successfully"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: clientosh-${{ matrix.name }}
          path: ${{ matrix.build_dir }}/clientosh*
          if-no-files-found: ignore
